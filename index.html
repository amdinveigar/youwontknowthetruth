
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YOU WON'T KNOW THE TRUTH</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    background: #000;
    color: #c90000;
    font-family: "Courier New", monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    text-align: center;
}
body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .15;
    background: repeating-linear-gradient(
        transparent 0px, transparent 2px,
        #650000 3px, transparent 4px
    );
    z-index: 5;
}
.container { position: relative; z-index: 2; padding: 25px; }
h1 {
    font-size: clamp(25px, 5vw, 48px);
    letter-spacing: 5px;
    text-shadow: 0 0 12px red;
    animation: flicker 3s infinite;
}
p { color: #750000; letter-spacing: 3px; }
#timer {
    font-size: clamp(35px, 8vw, 65px);
    margin: 35px 0;
    text-shadow: 0 0 15px red;
}
button {
    background: transparent;
    color: #d00000;
    border: 1px solid #850000;
    padding: 16px 28px;
    font-family: inherit;
    font-size: 16px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: .2s;
}
button:hover {
    background: #650000;
    color: white;
    box-shadow: 0 0 25px red;
}
#message {
    height: 35px;
    margin-top: 25px;
    color: #ff0000;
    letter-spacing: 2px;
}
#clicks { color: #420000; font-size: 12px; margin-top: 20px; }
#blackout {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 20;
    background: #000;
    align-items: center;
    justify-content: center;
    color: red;
    font-size: clamp(20px, 5vw, 38px);
    text-shadow: 0 0 15px red;
    letter-spacing: 4px;
}
#glitch {
    position: fixed;
    inset: 0;
    z-index: 30;
    background: red;
    opacity: 0;
    pointer-events: none;
}
.glitching { animation: breakScreen .7s forwards; }
@keyframes flicker {
    0%, 95%, 100% { opacity: 1; }
    96% { opacity: .3; }
    97% { opacity: .9; }
}
@keyframes breakScreen {
    0% { opacity: 0; }
    15% { opacity: .8; transform: translateX(12px); }
    30% { opacity: .1; transform: translateX(-15px); }
    45% { opacity: .9; transform: skewY(5deg); }
    70% { opacity: .5; transform: translateX(8px); }
    100% { opacity: 1; }
}
.noise {
    position: fixed;
    height: 2px;
    width: 100%;
    left: 0;
    background: rgba(255,0,0,.5);
    z-index: 10;
    pointer-events: none;
    animation: noiseMove .2s linear;
}
@keyframes noiseMove {
    from { transform: translateX(-100%); }
    to { transform: translateX(100%); }
}
</style>
</head>
<body>
<div class="container">
    <h1>YOU WON'T KNOW THE TRUTH</h1>
    <p>ТЫ НЕ ДОЛЖЕН БЫЛ ЭТО НАЙТИ</p>
    <div id="timer">61:61:61</div>
    <button id="leave">ПОКИНУТЬ ВСЕЛЕННУЮ</button>
    <div id="message"></div>
    <div id="clicks">ПОПЫТКИ: 0 / 6</div>
</div>

<div id="blackout">НЕ НАЖИМАЙ ШЕСТОЙ РАЗ</div>
<div id="glitch"></div>

<script>
let seconds = 61 * 3600 + 61 * 60 + 61;
const timer = document.getElementById("timer");

function updateTimer() {
    if (seconds > 0) seconds--;
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = seconds % 60;
    timer.textContent =
        String(h).padStart(2, "0") + ":" +
        String(m).padStart(2, "0") + ":" +
        String(s).padStart(2, "0");
}
setInterval(updateTimer, 1000);

let count = 0;
let locked = false;

const messages = [
    "СИГНАЛ ПРИНЯТ",
    "ТЫ УВЕРЕН?",
    "КТО-ТО СЛУШАЕТ",
    "НЕ СЧИТАЙ ВСЛУХ"
];

const message = document.getElementById("message");
const clicks = document.getElementById("clicks");
const blackout = document.getElementById("blackout");
const glitch = document.getElementById("glitch");

document.getElementById("leave").addEventListener("click", () => {
    if (locked || count >= 6) return;
    count++;
    clicks.textContent = "ПОПЫТКИ: " + count + " / 6";

    if (count <= 4) {
        message.textContent = messages[count - 1];
    }

    if (count === 5) {
        locked = true;
        blackout.style.display = "flex";
        setTimeout(() => {
            blackout.style.display = "none";
            message.textContent = "ТЕПЕРЬ УЖЕ ПОЗДНО";
            locked = false;
        }, 1300);
    }

    if (count === 6) {
        locked = true;
        message.textContent = "ТЫ САМ ЭТОГО ХОТЕЛ";
        glitch.classList.add("glitching");
        setTimeout(() => {
            window.location.href =
"https://amdinveigar.github.io/youwontknowthetruth/truth.html";
        }, 750);
    }
});

// Случайные горизонтальные помехи
setInterval(() => {
    if (Math.random() > 0.55) {
        const line = document.createElement("div");
        line.className = "noise";
        line.style.top = Math.random() * 100 + "vh";
        document.body.appendChild(line);
        setTimeout(() => line.remove(), 250);
    }
}, 900);
    
// =====================================
// PROJECT: YOU WON'T KNOW THE TRUTH
// MODULE 01: MEMORY
// =====================================

// Запоминаем количество посещений
let visits = Number(localStorage.getItem("truth_visits") || 0);
visits++;

localStorage.setItem("truth_visits", visits);

// Сообщение при возвращении
if (visits > 1) {
    setTimeout(() => {
        message.textContent = "ТЫ ВЕРНУЛСЯ. МЫ ЗНАЛИ.";
    }, 3000);
}

// Сообщения при бездействии
const idleMessages = [
    "ТЫ ВСЁ ЕЩЁ ЗДЕСЬ?",
    "МЫ ВИДИМ ТЕБЯ",
    "НЕ ДЕЛАЙ ВИД, ЧТО НЕ ЗАМЕТИЛ",
    "ТЫ МОЖЕШЬ ЗАКРЫТЬ ЭТУ СТРАНИЦУ",
    "МЫ НИКУДА НЕ УШЛИ",
    "НЕ ОБОРАЧИВАЙСЯ"
];

let idleTimer;
let idleIndex = 0;

function resetIdle() {
    clearTimeout(idleTimer);

    idleTimer = setTimeout(() => {
        if (count < 6 && !locked) {
            message.textContent =
                idleMessages[idleIndex % idleMessages.length];

            idleIndex++;
        }

        resetIdle();
    }, 20000);
}

document.addEventListener("mousemove", resetIdle);
document.addEventListener("keydown", resetIdle);
document.addEventListener("click", resetIdle);

resetIdle();

// Иногда меняем название вкладки
const originalTitle = document.title;

setInterval(() => {
    if (Math.random() > 0.65) {
        document.title = "МЫ ЗДЕСЬ";
        
        setTimeout(() => {
            document.title = originalTitle;
        }, 1800);
    }
}, 12000);

</script>
</body>
</html>
