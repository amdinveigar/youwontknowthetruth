
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WE ARE HERE</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    background: #000;
    color: #780000;
    font-family: "Courier New", monospace;
}
body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    background: repeating-linear-gradient(
        transparent 0px, transparent 2px,
        rgba(150,0,0,.12) 3px, transparent 4px
    );
}
#symbols {
    position: fixed;
    inset: 0;
    overflow: hidden;
}
.symbol {
    position: absolute;
    color: #570000;
    font-size: 14px;
    opacity: .5;
    animation: floatUp linear infinite;
    text-shadow: 0 0 8px #8b0000;
}
@keyframes floatUp {
    from { transform: translateY(110vh); }
    to { transform: translateY(-15vh); }
}
.center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    width: 90%;
    z-index: 3;
}
#truth {
    font-size: clamp(28px, 7vw, 65px);
    letter-spacing: 8px;
    color: #a00000;
    text-shadow: 0 0 15px red;
    min-height: 90px;
}
.subtitle {
    font-size: 12px;
    letter-spacing: 5px;
    color: #350000;
    margin-top: 30px;
}
.flash {
    animation: flash .15s infinite;
}
@keyframes flash {
    0% { opacity: 1; }
    50% { opacity: .25; }
    100% { opacity: 1; }
}
</style>
</head>
<body>
<div id="symbols"></div>

<div class="center">
    <div id="truth"></div>
    <div class="subtitle">МЫ ЖДАЛИ, ПОКА ТЫ НАЖМЁШЬ</div>
</div>

<script>
const symbols = document.getElementById("symbols");
const characters = "010101010101 666 06 13 Я НЕ ТЫ МЫ 001101";

for (let i = 0; i < 90; i++) {
    const el = document.createElement("div");
    el.className = "symbol";
    el.textContent = characters[Math.floor(Math.random() * characters.length)];
    el.style.left = Math.random() * 100 + "vw";
    el.style.animationDuration = (8 + Math.random() * 20) + "s";
    el.style.animationDelay = (-Math.random() * 25) + "s";
    el.style.fontSize = (10 + Math.random() * 18) + "px";
    symbols.appendChild(el);
}

const truth = document.getElementById("truth");
const phrase = "МЫ УЖЕ ЗДЕСЬ";
const pool = "010101ЯМЫ#%!?666";

function reveal() {
    let iteration = 0;
    const interval = setInterval(() => {
        truth.textContent = phrase
            .split("")
            .map((char, index) => {
                if (char === " ") return " ";
                if (index < iteration) return phrase[index];
                return pool[Math.floor(Math.random() * pool.length)];
            })
            .join("");

        iteration += 0.35;

        if (iteration >= phrase.length) {
            clearInterval(interval);
            truth.textContent = phrase;
            truth.classList.add("flash");

            setTimeout(() => {
                truth.classList.remove("flash");
                truth.textContent = "";
                setTimeout(reveal, 1200);
            }, 3500);
        }
    }, 100);
}

setTimeout(reveal, 1500);
</script>
    
<!-- SECRET TERMINAL — UPDATE 02 -->
<style>
#secret-trigger {
  position: fixed;
  right: 15px;
  bottom: 12px;
  color: #641010;
  opacity: .12;
  font: 12px monospace;
  cursor: pointer;
  z-index: 9998;
  transition: opacity .3s;
}
#secret-trigger:hover { opacity: .8; }

#secret-terminal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(0,0,0,.97);
  color: #c9c9c9;
  font-family: "Courier New", monospace;
  padding: 25px;
  box-sizing: border-box;
  align-items: center;
  justify-content: center;
}

#secret-terminal.active { display: flex; }

.terminal-window {
  width: min(650px, 100%);
  height: min(480px, 85vh);
  border: 1px solid #581010;
  background: #050505;
  box-shadow: 0 0 35px rgba(120,0,0,.15);
  display: flex;
  flex-direction: column;
  padding: 15px;
  box-sizing: border-box;
}

.terminal-header {
  color: #8b1717;
  border-bottom: 1px solid #351010;
  padding-bottom: 10px;
  font-size: 12px;
  letter-spacing: 2px;
}

#terminal-output {
  flex: 1;
  overflow-y: auto;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 13px;
  line-height: 1.7;
  padding: 12px 0;
}

.terminal-line { margin-bottom: 5px; }
.terminal-system { color: #8c2424; }
.terminal-user { color: #eee; }
.terminal-secret { color: #c51d1d; text-shadow: 0 0 8px red; }

.terminal-input-row {
  display: flex;
  border-top: 1px solid #351010;
  padding-top: 12px;
  gap: 8px;
}

#terminal-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: #ddd;
  font: 14px "Courier New", monospace;
  min-width: 0;
}

.terminal-prompt { color: #8b1717; }

#terminal-close {
  background: transparent;
  border: none;
  color: #642020;
  cursor: pointer;
  font: 12px monospace;
  float: right;
}
</style>

<div id="secret-trigger">06</div>

<div id="secret-terminal">
  <div class="terminal-window">
    <div class="terminal-header">
      UNKNOWN CONNECTION
      <button id="terminal-close">[ CLOSE ]</button>
    </div>

    <div id="terminal-output"></div>

    <div class="terminal-input-row">
      <span class="terminal-prompt">&gt;</span>
      <input id="terminal-input" autocomplete="off"
        spellcheck="false" placeholder="ВВЕДИТЕ КОМАНДУ...">
    </div>
  </div>
</div>

<script>
(() => {
  const trigger = document.getElementById("secret-trigger");
  const terminal = document.getElementById("secret-terminal");
  const output = document.getElementById("terminal-output");
  const input = document.getElementById("terminal-input");
  const close = document.getElementById("terminal-close");

  let unlocked = localStorage.getItem("truth_terminal_unlocked") === "yes";
  let openedBefore = false;
  let autonomousTimer = null;

  function print(text, type = "system") {
    const line = document.createElement("div");
    line.className = "terminal-line terminal-" + type;
    line.textContent = text;
    output.appendChild(line);
    output.scrollTop = output.scrollHeight;
  }

  function openTerminal() {
    terminal.classList.add("active");
    input.focus();

    if (!openedBefore) {
      openedBefore = true;
      print("ИНИЦИАЛИЗАЦИЯ...");
      print("ПОДКЛЮЧЕНИЕ УСТАНОВЛЕНО.");
      print("ИСТОЧНИК: НЕИЗВЕСТЕН.");
      print(" ");
      print("ВВЕДИТЕ help ДЛЯ СПИСКА КОМАНД.");
      
      autonomousTimer = setTimeout(() => {
        if (terminal.classList.contains("active")) {
          print(" ");
          print("...ТЫ ДОЛГО НЕ ПИСАЛ.", "secret");
        }
      }, 45000);
    }
  }

  function closeTerminal() {
    terminal.classList.remove("active");
    input.blur();
    clearTimeout(autonomousTimer);
  }

  trigger.addEventListener("click", openTerminal);
  close.addEventListener("click", closeTerminal);

  document.addEventListener("keydown", (e) => {
    if (
      (e.key === "~" || e.code === "Backquote") &&
      !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)
    ) {
      e.preventDefault();
      openTerminal();
    }

    if (e.key === "Escape" && terminal.classList.contains("active")) {
      closeTerminal();
    }
  });

  function processCommand(raw) {
    const command = raw.trim().toLowerCase();

    if (!command) return;

    print("> " + raw, "user");

    switch (command) {
      case "help":
        print("ДОСТУПНЫЕ КОМАНДЫ:");
        print("who  — ИДЕНТИФИКАЦИЯ");
        print("where — МЕСТОПОЛОЖЕНИЕ");
        print("exit — ЗАВЕРШЕНИЕ СЕАНСА");
        print(" ");
        print("ОСТАЛЬНОЕ ТЕБЕ НЕ НУЖНО.");
        break;

      case "who":
        print("МЫ.", "secret");
        print("НАС НЕ ДОЛЖНО БЫТЬ.");
        break;

      case "where":
        print("РЯДОМ.", "secret");
        print("ТЫ ПРОСТО НЕ СМОТРИШЬ В НУЖНУЮ СТОРОНУ.");
        break;

      case "exit":
        print("ВЫХОДА НЕТ.", "secret");
        print("СЕАНС НЕ МОЖЕТ БЫТЬ ЗАВЕРШЁН.");
        setTimeout(closeTerminal, 1800);
        break;

      case "6161":
        if (!unlocked) {
          unlocked = true;
          localStorage.setItem("truth_terminal_unlocked", "yes");
          print(" ");
          print("СОВПАДЕНИЕ ОБНАРУЖЕНО.", "secret");
          print("ПЕРВЫЙ ФРАГМЕНТ ВОССТАНОВЛЕН.");
          print(" ");
          print("06 / 13 / 03:17");
          print(" ");
          print("ТЫ НАШЁЛ ПЕРВОЕ СОВПАДЕНИЕ.", "secret");
        } else {
          print("ТЫ УЖЕ ЗНАЕШЬ.");
          print("НЕ ЗАСТАВЛЯЙ НАС ПОВТОРЯТЬ.");
        }
        break;

      default:
        const responses = [
          "НЕИЗВЕСТНАЯ КОМАНДА.",
          "МЫ НЕ ПОНИМАЕМ ТВОЙ ЯЗЫК.",
          "НЕ ПЫТАЙСЯ НАЙТИ НАС.",
          "ТЫ УЖЕ СПРАШИВАЛ.",
          "ЭТО НЕ ТВОЙ ТЕРМИНАЛ.",
          "ЗАПРОС ПРИНЯТ. ОТВЕТА НЕ БУДЕТ."
        ];

        print(responses[Math.floor(Math.random() * responses.length)], "secret");
    }

    print(" ");
  }

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      const value = input.value;
      input.value = "";
      processCommand(value);
    }
  });
})();
</script>
<!-- END SECRET TERMINAL -->

</body>
</html>
